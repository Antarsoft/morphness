# Morphness configuration: structural facts the harness reads.
# Prose (stack, commands, risk notes) lives in project/*.md. /morph-init writes this file;
# edit it by hand any time, then run /morph-doctor. /morph-update brings in upstream changes.

project:
  name: "{{project.name}}"
  description: "{{project.description}}"

humans:
  # The owner approves plans, decides open questions, merges and releases.
  - { name: "{{human.name}}", github: "{{human.github}}", role: owner }

# Where the harness runs: claude-code-cli, claude-code-web, claude-projects (any combination).
environment: [claude-code-cli]

branches:
  integration: dev        # feature branches start here and feature PRs target it
  production: main        # moves only through a release; set equal to integration for a single-branch flow
  default: dev            # the code host's default branch (harness/RELEASE.md § Default branch); the owner sets it on the host

# Shared environments, in the order code moves through them (harness/RELEASE.md § Environments).
# Each one runs one branch: the first runs branches.integration, the last runs branches.production.
# A middle one (for example staging) runs the integration branch too, or has its own branch that a
# promotion PR moves code into. Add, rename or remove entries any time, then run /morph-doctor: it
# lists the files to bring in step. [] when nothing is deployed (a library, a CLI tool).
#   deploy: host (the host deploys on push) | workflow (ci_cd.deploy) | manual (the owner) | none
#   real_data: true when real people's data lives there; every deploy and migration waits for the owner
environments:
  - { name: dev, branch: dev, deploy: host, real_data: false }
  - { name: production, branch: main, deploy: host, real_data: true }

# Apps in a monorepo (optional). [] for a single-app repo: the stack, checks and environments then
# apply to the whole repo, as before. One entry per app or package that is built, tested or deployed on
# its own (harness/RELEASE.md § Apps). path: its folder. stack: one line, when it differs from the
# repo's. e2e: its browser-test spec folder (browser-e2e module), or none. deploy: for each name in
# `environments`, how this app gets there (host | workflow | manual | none); a name left out is none.
apps: []
#  - { name: web, path: apps/web, stack: "Next.js", e2e: apps/web/e2e, deploy: { dev: host, production: host } }
#  - { name: api, path: apps/api, stack: "Go 1.23", e2e: none, deploy: { dev: workflow, production: workflow } }

pr_host: github           # github | gitlab | none

# Host-side protection on every branch in `environments` (harness/RELEASE.md § Branch protection):
# changes only through a PR, no force-push, no deletion. The ruleset is
# .github/rulesets/environment-branches.json: /morph-init or /morph-doctor applies it with `gh api` on
# the owner's yes, else the owner imports it (GitLab: protected branches); /morph-doctor checks it.
# required_approvals: 0 for a solo owner (GitHub doesn't let you approve your own PR), 1 or more with
# a team. With ci_gate: true the CI check is required too.
# delete_merged_branches: the host deletes a PR's branch once it merges. Protected and default
# branches are never deleted, so only turn it on with enabled: true (release PRs merge from them).
branch_protection:
  enabled: true
  required_approvals: 0
  delete_merged_branches: true

# Who merges PRs. never: the human, or the Technical Lead on the human's explicit ask for that PR
# (merge commands are `ask` rules in .claude/settings.json). integration: the Technical Lead may also
# merge a ready feature PR into the integration branch once the merge gate holds. Merges into the
# production branch (release, promotion, hotfix) are always the human's, so with a single-branch
# flow integration acts as never.
merge_by_agent: never

# true: every merge to the production branch gets a version tag (harness/RELEASE.md § Versions), from
# the tag workflow when ci_cd.tags has one, else from the command the Technical Lead hands the owner.
# false: no tags; the release PR title and _harness/releases/<version>/ are the record.
# per-package: a monorepo whose packages carry their own versions; the repo's versioning tool
# (Changesets, Nx release, release-please) bumps them and writes `<package>@x.y.z` tags, and
# releases are named by date (harness/RELEASE.md § Per-package versions).
release_tags: true

roadmap:
  enabled: true
  file: docs/ROADMAP.md
  versions_dir: docs/versions

# Optional modules under harness/modules/: claude-projects, data-access, browser-e2e, legal, roadmap, ci-cd
modules: [roadmap]

# Named checks. Commands for each name live in project/CONTROLS.md.
checks:
  before_qa: [install, typecheck, lint, unit, build]
  before_signoff: [install, typecheck, lint, unit, build, e2e-full]

# true: CI on the PR is a required gate. false: QA/qa-result.md on the final commit is the gate.
ci_gate: false

# ci-cd module: the pipelines the harness set up and checks. A workflow path, or none.
# deploy can also be `host` (the hosting platform deploys on push) or `manual`.
# tags: the workflow that tags merges to the production branch (only with release_tags: true).
# on_drafts: false skips CI on draft PRs (it runs when the PR is marked ready), saving Actions minutes
# on private repos; true runs it on every push to a draft too (free on public repos).
# Agents edit these files in a planned feature; only the owner runs deploys and migrations.
ci_cd:
  ci: none
  on_drafts: false
  deploy: host
  migrations: none
  tags: none

# Areas where a change to their behaviour gets full mode, never medium effort, and a security review (e.g. auth, billing, migrations).
# A fully specified change that alters none of that behaviour still uses small mode (harness/MODES.md § Small mode).
risk_areas: []

agents:
  # Default: Sonnet in every role, at about half the cost of Opus; the plan, QA and checks carry the quality.
  # The "Opus for planning and building" preset sets technical_lead and fullstack to opus and researcher's high_model to opus.
  technical_lead: { model: sonnet, effort: high }
  fullstack: { model: sonnet, medium_model: sonnet, default: high, variants: [medium, high, xhigh] }
  qa: { model: sonnet, medium_model: sonnet, default: high, variants: [medium, high] }
  researcher: { model: sonnet, high_model: sonnet, default: medium, variants: [medium, high] }   # read-only; research mode and research before a plan
  legal_writer: { model: fable, effort: high }   # use opus if fable isn't available to you

# Advisory only: Claude Projects settings can't be set from a repo.
# See harness/modules/claude-projects/README.md for where to set them.
claude_projects:
  coordinator: { model: opus, effort: medium }
  feature_threads: { model: opus, effort: high }
  one_shot_threads: { model: opus, effort: medium }

# What each feature's Claude Code work would cost at public API prices, for comparing features
# (harness/SETUP.md § Retrospective → Feature cost). scripts/feature-cost.sh reads the session
# transcripts and prices them from the table in `prices`; edit that table for your own rates.
# An estimate even on a Pro or Max plan, where nothing is billed per call. track: false turns it off.
cost: { track: true, prices: harness/MODEL_PRICES.md }

# The guard hook (scripts/guard.sh, wired in .claude/settings.json) runs before tool calls. It always
# blocks secret .env files, pushes to environment branches, force-pushes, code-host secrets and
# well-known remote database writes. mcp_writes: ask makes every MCP tool that isn't a read (get,
# list, search, …) show a permission prompt, so no connector write runs without the owner's yes; off
# leaves MCP tools to the ask rules in .claude/settings.json.
guard: { mcp_writes: ask }

loop:
  retro_max_items: 3      # usual action items per retro (soft: more with one line why, none is fine)
  prune_every: 10         # learnings files between prunes
  rule_budget_kb: 36      # always-loaded rule files (CLAUDE.md, AGENTS.md, .claude/rules/); over it, a prune is due
  checklist_budget_kb: 36 # harness/PLAN_CHECKLIST.md plus project/PLAN_CHECKLIST.md; over it, a prune is due
  project_docs_budget_kb: 48 # project/*.md fact docs; over it, a prune is due
  qa_max_rounds: 2        # QA rework rounds before escalating to the owner

# Where this copy came from upstream. Written by /morph-init, updated by /morph-update.
# commit: the Morphness commit the kit was last synced to (the base for merging kit updates).
# release: the Morphness release that commit belongs to. updates: kit update notes (updates/ in
# Morphness) this project applied, declined or put off; deferred ones keep their own base commit.
# Nothing upstream changes this copy on its own: /morph-update offers each update for your yes.
installed_from:
  repo: "{{morphness.repo}}"
  commit: "{{morphness.commit}}"
  release: "{{morphness.release}}"
  updates: { applied: [], declined: [], deferred: [] }   # deferred entries: { id: <note id>, base: <commit> }
