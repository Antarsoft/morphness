# Morphness configuration: structural facts the harness reads.
# Prose (stack, commands, risk notes) lives in project/*.md. /morph-init writes this file;
# edit it by hand any time, then run /morph-doctor. /morph-update brings in upstream changes.

project:
  name: "{{project.name}}"
  description: "{{project.description}}"

humans:
  # The owner approves plans, decides open questions, merges and releases.
  - { name: "{{human.name}}", github: "{{human.github}}", role: owner }

# Where the harness runs: claude-code-cli, claude-code-web, claude-projects (any combination).
environment: [claude-code-cli]

branches:
  integration: dev        # feature branches start here and feature PRs target it
  production: main        # moves only through a release; set equal to integration for a single-branch flow

# Shared environments, in the order code moves through them (harness/RELEASE.md § Environments).
# Each one runs one branch: the first runs branches.integration, the last runs branches.production.
# A middle one (for example staging) runs the integration branch too, or has its own branch that a
# promotion PR moves code into. Add, rename or remove entries any time, then run /morph-doctor: it
# lists the files to bring in step. [] when nothing is deployed (a library, a CLI tool).
#   deploy: host (the host deploys on push) | workflow (ci_cd.deploy) | manual (the owner) | none
#   real_data: true when real people's data lives there; every deploy and migration waits for the owner
environments:
  - { name: dev, branch: dev, deploy: host, real_data: false }
  - { name: production, branch: main, deploy: host, real_data: true }

pr_host: github           # github | gitlab | none

# Host-side protection on every branch in `environments` (harness/RELEASE.md § Branch protection):
# changes only through a PR, no force-push, no deletion. Agents can't set it; the owner imports
# .github/rulesets/environment-branches.json (GitHub) or sets protected branches (GitLab), and
# /morph-doctor checks it. required_approvals: 0 for a solo owner (GitHub doesn't let you approve
# your own PR), 1 or more with a team. With ci_gate: true the CI check is required too.
branch_protection:
  enabled: true
  required_approvals: 0

# true: every merge to the production branch gets a version tag (harness/RELEASE.md § Versions), from
# the tag workflow when ci_cd.tags has one, else from the command the Technical Lead hands the owner.
# false: no tags; the release PR title and _harness/releases/<version>/ are the record.
release_tags: true

roadmap:
  enabled: true
  file: docs/ROADMAP.md
  versions_dir: docs/versions

# Optional modules under harness/modules/: claude-projects, data-access, browser-e2e, legal, roadmap, ci-cd
modules: [roadmap]

# Named checks. Commands for each name live in project/CONTROLS.md.
checks:
  before_qa: [install, typecheck, lint, unit, build]
  before_signoff: [install, typecheck, lint, unit, build, e2e-full]

# true: CI on the PR is a required gate. false: QA/qa-result.md on the final commit is the gate.
ci_gate: false

# ci-cd module: the pipelines the harness set up and checks. A workflow path, or none.
# deploy can also be `host` (the hosting platform deploys on push) or `manual`.
# tags: the workflow that tags merges to the production branch (only with release_tags: true).
# Agents edit these files in a planned feature; only the owner runs deploys and migrations.
ci_cd:
  ci: none
  deploy: host
  migrations: none
  tags: none

# Areas that never get medium effort and always get a careful plan (e.g. auth, billing, migrations).
risk_areas: []

agents:
  technical_lead: { model: opus, effort: high }
  # Advised defaults (they worked on the project Morphness came from); change any of them.
  fullstack: { model: opus, medium_model: sonnet, default: high, variants: [medium, high, xhigh] }
  qa: { model: sonnet, medium_model: sonnet, default: high, variants: [medium, high] }
  legal_writer: { model: fable, effort: high }   # use opus if fable isn't available to you

# Advisory only: Claude Projects settings can't be set from a repo.
# See harness/modules/claude-projects/README.md for where to set them.
claude_projects:
  coordinator: { model: opus, effort: medium }
  feature_threads: { model: opus, effort: high }
  one_shot_threads: { model: opus, effort: medium }

loop:
  retro_max_items: 3      # action items per retrospective
  prune_every: 10         # learnings files between prunes
  qa_max_rounds: 2        # QA rework rounds before escalating to the owner

# Where this copy came from upstream. Written by /morph-init, updated by /morph-update.
# commit: the Morphness commit the kit was last synced to (the base for merging kit updates).
# release: the Morphness release that commit belongs to. updates: kit update notes (updates/ in
# Morphness) this project applied, declined or put off; deferred ones keep their own base commit.
# Nothing upstream changes this copy on its own: /morph-update offers each update for your yes.
installed_from:
  repo: "{{morphness.repo}}"
  commit: "{{morphness.commit}}"
  release: "{{morphness.release}}"
  updates: { applied: [], declined: [], deferred: [] }   # deferred entries: { id: <note id>, base: <commit> }
