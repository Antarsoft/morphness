# Deploy (Morphness ci-cd module). Only for hosts that don't deploy on push themselves.
# Agents never start, re-run or approve this workflow. Credentials are environment secrets on
# environments that require the owner's approval, never repository secrets.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [{{environments.names}}]
  # morph-init: fill, or delete these two lines: automatic deploys of the integration environment on each push to its branch.
  push:
    branches: ["{{branches.integration}}"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04   # pinned: bump it in its own PR
    environment: ${{ inputs.environment || '{{environments.first}}' }}
    concurrency:
      group: deploy-${{ inputs.environment || '{{environments.first}}' }}
      cancel-in-progress: false
    steps:
      # Each environment deploys only from its own branch (harness.config.yml → environments).
      - name: branch guard
        env:
          TARGET: ${{ inputs.environment || '{{environments.first}}' }}
          REF: ${{ github.ref_name }}
        run: |
          case "$TARGET" in
            # morph-init: fill one line per entry in harness.config.yml → environments: <name>) want=<branch> ;;
            *) echo "Unknown environment: $TARGET"; exit 1 ;;
          esac
          if [ "$REF" != "$want" ]; then
            echo "$TARGET deploys only from $want; this run is on $REF."
            exit 1
          fi

      - uses: actions/checkout@v4

      # morph-init: fill the toolchain setup and the build, using the commands in project/CONTROLS.md.

      # morph-init: fill the deploy command for the host, reading its token from an environment secret. Example:
      #   - name: deploy
      #     env:
      #       DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      #     run: <host CLI> deploy --token "$DEPLOY_TOKEN"
