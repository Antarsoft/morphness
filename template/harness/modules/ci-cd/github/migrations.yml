# Database migrations (Morphness ci-cd module). The workflow the data-access module and
# project/RELEASE.md refer to. Only the owner starts it; agents never start, re-run or approve it.
# The database URL is an environment secret on environments that require the owner's approval.
name: migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database to migrate
        type: choice
        options: [{{environments.names}}]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04   # pinned: bump it in its own PR
    environment: ${{ inputs.environment }}
    concurrency:
      group: migrations-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      # Each environment migrates from its own branch, except production: it gets the migrations from
      # the release branch being reviewed, before the release PR merges (harness/RELEASE.md step 4).
      - name: branch guard
        env:
          TARGET: ${{ inputs.environment }}
          REF: ${{ github.ref_name }}
        run: |
          case "$TARGET" in
            # morph-init: fill one line per entry in harness.config.yml → environments: <name>) want=<branch> ;;
            # with the release branch (the integration branch unless a middle environment has its own) for production.
            *) echo "Unknown environment: $TARGET"; exit 1 ;;
          esac
          if [ "$REF" != "$want" ]; then
            echo "Migrations for $TARGET run from $want; this run is on $REF."
            exit 1
          fi

      - uses: actions/checkout@v4

      # morph-init: fill the toolchain setup and install, using the commands in project/CONTROLS.md.

      # morph-init: fill the commands that list pending migrations, apply them, and list them again so the
      # log shows nothing is left pending (project/RELEASE.md § Production migrations). Example:
      #   - name: migrate
      #     env:
      #       DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #     run: <migrate command> status && <migrate command> up && <migrate command> status
