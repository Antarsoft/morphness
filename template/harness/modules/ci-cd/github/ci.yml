# CI for pull requests (Morphness ci-cd module). Runs the before_qa named checks with the exact
# commands in project/CONTROLS.md. Change a command there and here in the same PR.
name: ci

on:
  pull_request:
    branches: ["{{branches.integration}}", "{{branches.production}}"]
    # ready_for_review: a draft that skipped CI gets its run the moment it's marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue runs the same required check on the PR combined with the latest base. Harmless
  # without a queue; without it, a queue that requires this check never finishes.
  merge_group:
  # The deploy workflow calls this before an automatic deploy, so a push deploys only once CI passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Drafts skip CI unless harness.config.yml → ci_cd.on_drafts is true. A skipped job counts as
    # passing a required check, which is safe: a draft can't merge, and marking it ready re-runs this.
    if: ${{ !github.event.pull_request.draft || {{ci.on_drafts}} }}
    runs-on: ubuntu-24.04   # pinned: bump it in its own PR
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0

      # A docs-only PR skips the steps below and still succeeds, so a required check never hangs.
      # DOCS is a regex for the documentation paths (harness/CONTROLS.md, plus project/CONTROLS.md changes); empty means always run.
      - name: scope
        id: scope
        env:
          BASE: origin/${{ github.base_ref }}
          DOCS: '{{ci.docs_regex}}'
        run: |
          code=true
          # Only a pull request can skip: a merge queue run or a pre-deploy call always checks everything.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$DOCS" ] && ! git diff --name-only "$BASE...HEAD" | grep -vE "$DOCS" | grep -q .; then
            code=false; echo "Docs-only change: skipping the checks"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # morph-init: fill the toolchain setup (for example actions/setup-node with the pinned version and
      # the package manager cache), each `uses:` pinned to a full commit SHA with the version in a comment, each step with `if: steps.scope.outputs.code == 'true'`.

      # morph-init: fill one step per check in harness.config.yml → checks.before_qa, in order, named after
      # the check and running its command from project/CONTROLS.md. Leave out e2e checks unless the plan
      # that adds CI times them (plan checklist item 37). Example:
      #   - name: lint
      #     if: steps.scope.outputs.code == 'true'
      #     run: {{cmd.lint}}
