name: trust
# Refreshes the public test results page (docs/trust.html) with scripts/trust-report.sh. Runs weekly and on demand.
# When a result changed, or the committed page is more than 30 days old, it opens a PR with the regenerated
# page for the owner to merge; otherwise it only reports. The job fails (red) when a check fails, a tool does
# not run or a finding has no verdict in tests/triage.jsonl. Needs the repo setting "Allow GitHub Actions to
# create and approve pull requests" (Settings > Actions > General).
on:
  schedule:
    - cron: "7 0 * * 1"   # Mondays 00:07 UTC = 04:07 GST
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: trust
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04   # pinned: bump it in its own PR
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet pyyaml uv
      - name: Run the report
        id: run
        run: |
          cp docs/trust/results.json "$RUNNER_TEMP/old.json"
          set +e
          scripts/trust-report.sh
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Open a PR when results changed or the page is old
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$RUNNER_TEMP/old.json" docs/trust/results.json <<'PY' > "$RUNNER_TEMP/decision.txt"
          import datetime, json, sys
          old, new = (json.load(open(p)) for p in sys.argv[1:3])
          def key(d):
              return [[r["name"], r["status"], r.get("summary"), r.get("version"),
                       [(f["rule"], f["path"], (f.get("triage") or {}).get("status")) for f in r.get("findings", [])]] for r in d["rows"]]
          age = (datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.strptime(old["generated"], "%Y-%m-%d %H:%M UTC").replace(tzinfo=datetime.timezone.utc)).days
          print("changed" if key(old) != key(new) else ("old" if age >= 30 else "same"))
          PY
          decision="$(cat "$RUNNER_TEMP/decision.txt")"
          echo "decision: $decision"
          if [ "$decision" = "same" ]; then exit 0; fi
          branch="trust-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/trust.html docs/trust
          git commit -m "Refresh the test results page"
          git push origin "$branch"
          body="$(printf '## What this adds\n\nThe weekly run of `scripts/trust-report.sh` (%s). The page and its raw logs are regenerated; nothing is edited by hand.\n' "$decision")"
          gh pr create --base main --head "$branch" --title "Refresh the test results page" --body "$body"
      - name: Fail when the report found a problem
        if: steps.run.outputs.rc != '0'
        run: |
          echo "scripts/trust-report.sh exited ${{ steps.run.outputs.rc }}: a check failed, a tool did not run, or a finding has no verdict" >&2
          exit 1
