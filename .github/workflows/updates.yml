name: updates
on:
  pull_request:
    paths: ["template/**", "updates/**", "skills/**", "CHANGELOG.md", ".claude-plugin/plugin.json", "scripts/check-updates.sh"]
  push:
    branches: [main]
    paths: ["template/**", "updates/**", "CHANGELOG.md", ".claude-plugin/plugin.json", "scripts/check-updates.sh"]
jobs:
  check:
    runs-on: ubuntu-24.04   # pinned: bump it in its own PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: scripts/check-updates.sh --since "origin/${{ github.base_ref }}"
      - if: github.event_name == 'push'
        run: scripts/check-updates.sh
