name: lessons
on:
  pull_request:
    paths: ["lessons/**", "scripts/check-lessons.sh"]
  push:
    branches: [main]
    paths: ["lessons/**", "scripts/check-lessons.sh"]
jobs:
  check:
    runs-on: ubuntu-24.04   # pinned: bump it in its own PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - run: scripts/check-lessons.sh
